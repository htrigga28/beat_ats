[project]
name = "beat-ats"
version = "1.0.0"
description = "Private resume tailoring application with a FastAPI service and Streamlit UI."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "google-genai==2.16.0",
    "httpx==0.28.1",
    "pdfplumber==0.11.10",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-docx==1.2.0",
    "python-multipart==0.0.20",
    "streamlit==1.60.0",
    "tenacity==9.1.2",
    "uvicorn[standard]==0.52.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
follow_imports = "skip"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
