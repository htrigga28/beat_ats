name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start API for OpenAPI drift check
        run: python -m uvicorn analyzer:app --host 127.0.0.1 --port 8000 &

      - name: Wait for API
        run: curl --fail --retry 20 --retry-delay 1 http://127.0.0.1:8000/openapi.json

      - name: Check generated API types
        working-directory: frontend
        run: npm run check:api-types

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend format
        working-directory: frontend
        run: npm run format

      - name: Frontend type check
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        working-directory: frontend
        run: npm run e2e

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy parser.py schemas.py settings.py analyzer.py generator.py index.py

      - name: Test
        run: python -m pytest --cov=. --cov-report=term-missing --cov-fail-under=85

      - name: Gemini model compatibility smoke test
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.verify_gemini_model

      - name: Smoke test compiled app
        run: |
          curl --fail --retry 10 --retry-delay 1 http://127.0.0.1:8000/
          curl --fail -H 'accept: text/html' http://127.0.0.1:8000/review
          curl --fail http://127.0.0.1:8000/healthz
          curl --fail http://127.0.0.1:8000/docs
          test -n "$(find public/assets -type f -maxdepth 1 -print -quit)"

      - name: Docker build
        run: docker build --tag beat-ats-ci .
